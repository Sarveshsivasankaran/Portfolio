name: Scheduled LinkedIn Featured Posts Scraper

on:
  schedule:
    # Runs daily at midnight UTC to check for new posts
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger via the GitHub Actions tab anytime

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright lxml

    - name: Install Playwright Chromium
      run: |
        python -m playwright install chromium --with-deps

    - name: Restore LinkedIn Session Cache
      env:
        LINKEDIN_SESSION_DATA: ${{ secrets.LINKEDIN_SESSION_JSON }}
      run: |
        if [ -z "$LINKEDIN_SESSION_DATA" ]; then
          echo "Error: LINKEDIN_SESSION_JSON secret is not set in your GitHub repository!"
          exit 1
        fi
        echo "$LINKEDIN_SESSION_DATA" > linkedin_session.json

    - name: Run Scraper Script
      run: |
        python scripts/scrape_linkedin.py

    - name: Commit and Push Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add files changed by scraper
        git add src/data/linkedinPosts.ts api/linkedin.ts
        
        # Check if there are changes to commit
        if git diff --cached --quiet; then
          echo "No new featured posts found. Skipping commit."
        else
          git commit -m "chore: auto-update linkedin featured posts [skip ci]"
          git push
        fi
